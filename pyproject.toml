[project]
name = "mongo-project"
version = "0.1.0"
description = "Metrologic: Calibration-aware agent memory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "pymongo>=4.19.0",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["backend/tests", "tests"]

